<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer ></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

<main>
     <form action="review.html" method="get">

        <div class="form-group">
                <label for="product">Product Name *</label>
                
                <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>

                </select>
        </div>
            
        <fieldset class="form-group">
            <legend>Overall Rating *</legend>

  
        
             <input type="radio" id="rating1" name="rating" value="1" required>
            <label for="rating1">&star;</label>

  
            <input type="radio" id="rating2" name="rating" value="2" required>
            <label for="rating2">&star;&star;</label>

  
           <input type="radio" id="rating3" name="rating" value="3" required>
           <label for="rating3">&star;&star;&star;</label>

  
           <input type="radio" id="rating4" name="rating" value="4" required>
           <label for="rating4">&star;&star;&star;&star;</label>

  
           <input type="radio" id="rating5" name="rating" value="5" required>
           <label for="rating5">&star;&star;&star;&star;&star;</label>

        </fieldset>

        <div class="form-group">
         <label for="installDate">Date of Installation *</label>
  
         <input type="date" id="installDate" name="installDate" required>
   
       </div>

       
       <fieldset class="form-group">
         <legend>Useful Features</legend>

         <input type="checkbox" id="feature1" name="features" value="Durability">
         <label for="feature1">Durability</label>

         <input type="checkbox" id="feature2" name="features" value="Energy Efficient">
         <label for="feature2">Energy Efficient</label>

         <input type="checkbox" id="feature3" name="features" value="Easy Installation">
         <label for="feature3">Easy Installation</label>

         <input type="checkbox" id="feature4" name="features" value="Warranty">
         <label for="feature4">Warranty</label>

        </fieldset>

        <div class="form-group">
         <label for="review">Written Review</label>
         <textarea id="review" name="review" rows="4" placeholder="Write your review here..."></textarea>
       </div>

       <div class="form-group">
         <label for="username">Your Name</label>
         <input type="text" id="username" name="username" placeholder="Enter your name">
       </div>

       <div class="form-group">
         <input type="submit" value="Submit Review">
       </div>


    </form>

</main>

    <footer>
        <p>@copy; <span id="year"></span> |Kelvn A Zhou | South Africa</p>
        <p id="lastModified"> </p>
    </footer>
</body>
</html>
